[dotfile_groups.macos]
root = "macos"
target = "~"
mode = "symlink-each"

[dotfile_groups.agents]
root = "agents"
target = "~"
mode = "symlink-each"

# Claude Code does not read ~/.agents/skills, so the same sources are linked
# into its skills directory as well.
[dotfile_groups.claude-skills]
root = "agents/.agents/skills"
target = "~/.claude/skills"
mode = "symlink-each"
